name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-lint:
    name: Backend Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/hsm --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other stylistic errors as warnings so it doesn't fail the build
          flake8 backend/hsm --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-build:
    name: Frontend Build (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend
      - name: Verify Build
        run: npm run build
        working-directory: ./frontend

  deploy:
    name: Continuous Deployment (CD)
    needs: [backend-lint, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/hsm
            # Stash any local changes to prevent merge conflicts
            sudo git stash
            sudo git pull origin main
            
            # Rebuild frontend
            cd /opt/hsm/frontend
            sudo npm install
            sudo npm run build
            
            # Restart backend services
            sudo systemctl restart hsm-api
            sudo systemctl restart hsm-collector
